<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pulau Tengah Laut - Mancing Online</title>
<link rel="stylesheet" href="hady.css">
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="logo">🎣</div>
    <h1>Pulau Tengah Laut</h1>
    <p class="subtitle">Game Mancing Online Bareng Temen</p>
    <label>Nama Pemancing</label>
    <input id="inputNama" placeholder="Contoh: hady" value="hady" maxlength="14" autocomplete="off">
    <label>ID Akun (Buat login di HP lain)</label>
    <div style="display:flex;gap:8px">
      <input id="inputID" placeholder="FISH-XXXXXX" style="flex:1" autocomplete="off">
      <button class="btn-small" onclick="buatIDBaru()">Buat ID</button>
    </div>
    <div id="idBaruBox" style="display:none;background:#e8f8e8;border:1px dashed #22c55e;padding:10px;border-radius:10px;margin-top:10px">
      <div style="font-size:12px;color:#666">ID Kamu, catat / salin ya!</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b id="idBaruText" style="font-size:18px;letter-spacing:1px">FISH-XXXXXX</b>
        <button class="btn-small" onclick="salinID()">Salin</button>
      </div>
    </div>
    <button class="btn-main" onclick="login()">▶ MULAI MANCING</button>
    <p style="font-size:12px;color:#888;text-align:center;margin-top:10px">ID penting buat nyimpen progress.<br>Kalo ganti HP, login pake ID yang sama.</p>
  </div>
</div>

<div id="game" style="display:none">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="card profile">
      <div class="avatar" id="ava">🧑</div>
      <div>
        <b id="pNama">hady</b>
        <div class="bar"><i id="xpBar" style="width:60%"></i></div>
        <div style="font-size:11px"><span id="pXP">0</span>/<span id="pXPMax">100</span> • Lv <span id="pLv">1</span></div>
      </div>
    </div>
    <div class="top-right">
      <div class="pill">💴 <span id="pYen">500</span> Yen</div>
    </div>
  </div>
  <div class="location"><b>Pulau Tengah Laut</b><br><span id="jam">Sel, 24 Nov · 16:39 WITA</span></div>

  <div id="chatFeed"></div>

  <button class="btn-chat" id="btnChat" onclick="toggleChat(event)">💬<span id="chatBadge" style="display:none">•</span></button>
  <div id="chatInputBar" style="display:none">
    <input id="chatInput" placeholder="Ketik chat..." maxlength="60" autocomplete="off">
    <button onclick="kirimChat(event)">Kirim</button>
  </div>
  <div id="chatCooldown"></div>

  <div id="barGame" style="display:none">
    <div class="tarik-card">
      <div class="tarik-ikan-besar" id="tantanganIkan">🐟</div>
      <div class="tarik-tier" id="tantanganTier">COMMON</div>
      <b id="tantanganNama">Ikan Nyangkut!</b>
      <div class="tarik-timer-wrap"><div class="tarik-timer" id="tarikTimerBar"></div></div>
      <div class="bar-wrap tarik-bar">
        <div class="bar-zone" id="barZone"></div>
        <div class="bar-zone-perfect" id="barZonePerfect"></div>
        <div id="ikanGerak">🐟</div>
      </div>
      <button class="btn-tarik" onclick="cobaTarik()">🎣 TARIK!</button>
      <button class="btn-lepas" onclick="gagalMancing()">Lepas</button>
    </div>
  </div>

  <div id="toast" style="display:none"></div>
  <div class="controls">
    <div class="joystick" id="joy"><div class="stick" id="stick"></div></div>
    <div class="right">
      <div class="mini-stats" id="buffs"></div>
      <div class="inventory" id="inv"></div>
      <button class="btn-fish" id="btnFish" onclick="klikTombolAksi()">🎣<br>Joran</button>
    </div>
  </div>
</div>

<div id="modal" style="display:none">
  <div class="modal-card" id="modalBox"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="hady.js"></script>
</body>
  </html>
